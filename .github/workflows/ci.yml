name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo; nothing here publishes.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keygate
          POSTGRES_PASSWORD: keygate
          POSTGRES_DB: keygate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Lint
        run: go vet ./...

      # Unit and integration tests together, against the postgres service.
      # Without TEST_DATABASE_URL the integration tests skip themselves,
      # so CI ran almost none of them. -p 1 runs one package at a time:
      # every package shares this database.
      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://keygate:keygate@localhost:5432/keygate?sslmode=disable
        run: go test -p 1 -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./cmd/server

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: cd web && bun install --frozen-lockfile

      - name: Type check
        run: cd web && bun run typecheck

      - name: Lint
        run: cd web && bun run lint

      - name: Build
        run: cd web && bun run build
